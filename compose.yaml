name: seekerlab

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seekerlab}:${POSTGRES_PASSWORD:?Run make setup}@db:5432/${POSTGRES_DB:-seekerlab}
  DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
  DEV_BUILDER_TOKEN: ${DEV_BUILDER_TOKEN:-}
  DEV_TESTER_TOKEN: ${DEV_TESTER_TOKEN:-}
  CORS_ORIGINS: '[]'
  SIWS_DOMAIN: ${SIWS_DOMAIN:-localhost:8000}
  SIWS_URI: ${SIWS_URI:-http://localhost:8000}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seekerlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: ${POSTGRES_DB:-seekerlab}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./apps/api
    image: seekerlab-api:dev
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    image: seekerlab-api:dev
    environment: *api-environment
    command: ["uvicorn", "seekerlab.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
