name: checks
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seekerlab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: seekerlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seekerlab -d seekerlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.6'
      - run: uv sync --locked --all-extras
      - run: uv run --locked ruff check src tests migrations
      - run: uv run --locked pytest -q
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://seekerlab:ci-only-password@localhost:5432/seekerlab_test
      - name: Check migration round trip on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://seekerlab:ci-only-password@localhost:5432/seekerlab_test
          APP_ENV: test
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m seekerlab.seed
          uv run --locked python -m seekerlab.seed
          uv run --locked alembic check
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm run export:android
